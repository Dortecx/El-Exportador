<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Exportador</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323:wght@400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    @keyframes glitch-title {
      0%, 100% { text-shadow: none; transform: translate(0); clip-path: none; }
      92% { text-shadow: none; transform: translate(0); clip-path: none; }
      93% { text-shadow: -3px 0 #FF0066, 3px 0 #00FFFF; transform: translate(2px, 0); clip-path: polygon(0 20%, 100% 20%, 100% 40%, 0 40%); }
      94% { text-shadow: 3px 0 #FF0066, -3px 0 #00FFFF; transform: translate(-2px, 0); clip-path: polygon(0 60%, 100% 60%, 100% 80%, 0 80%); }
      95% { text-shadow: -2px 0 #00FFFF, 2px 0 #FF0066; transform: translate(1px, 0); clip-path: polygon(0 10%, 100% 10%, 100% 30%, 0 30%); }
      96% { text-shadow: 2px 0 #FF0066, -2px 0 #00FFFF; transform: translate(-1px, 0); clip-path: none; }
      97% { text-shadow: none; transform: translate(0); clip-path: none; }
    }

    @keyframes card-border-glitch {
      0%, 100% { border-color: #00AAFF; box-shadow: 0 0 0 transparent; }
      96% { border-color: #00AAFF; box-shadow: 0 0 0 transparent; }
      97% { border-color: #FFFFFF; box-shadow: 0 0 15px #00AAFF, 0 0 30px rgba(0, 170, 255, 0.3); }
      98% { border-color: #00AAFF; box-shadow: 0 0 0 transparent; }
    }

    @keyframes dash {
      to { stroke-dashoffset: -20; }
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    @keyframes auth-status-pulse {
      0%, 7% { opacity: 0.72; filter: brightness(0.8); transform: translateX(0); text-shadow: 0 0 0 transparent; }
      8% { opacity: 0.46; transform: translateX(-5px) skewX(-6deg); text-shadow: 4px 0 #00E1FF, -4px 0 #FF3366; }
      10% { opacity: 0.92; transform: translateX(5px) skewX(5deg); text-shadow: -4px 0 #00E1FF, 4px 0 #FF3366; }
      13% { opacity: 0.72; transform: translateX(0); text-shadow: 0 0 0 transparent; }
      22% { opacity: 1; filter: brightness(2); transform: translateX(0); text-shadow: 0 0 16px currentColor, 0 0 32px currentColor, 0 0 48px currentColor; }
      66% { opacity: 1; filter: brightness(1.7); transform: translateX(0); text-shadow: 0 0 12px currentColor, 0 0 26px currentColor; }
      72% { opacity: 0.48; filter: brightness(1.1); transform: translateX(5px) skewX(6deg); text-shadow: -4px 0 #00E1FF, 4px 0 #FF3366; }
      75% { opacity: 0.8; transform: translateX(-3px) skewX(-4deg); text-shadow: 4px 0 #00E1FF, -4px 0 #FF3366; }
      79%, 100% { opacity: 0.72; filter: brightness(0.8); transform: translateX(0); text-shadow: 0 0 0 transparent; }
    }

    #authStatus.auth-status-pulse {
      animation: auth-status-pulse 4.5s ease-out;
      will-change: filter, opacity, text-shadow, transform;
    }

    @keyframes dry-run-label-pulse {
      0%, 100% { filter: brightness(1); text-shadow: 0 0 0 transparent; }
      50% { filter: brightness(1.25); text-shadow: 0 0 8px #00E1FF; }
    }

    @keyframes dry-run-checkbox-pulse {
      0%, 100% { box-shadow: 0 0 8px rgba(0, 225, 255, 0.7), inset 0 0 4px rgba(255, 255, 255, 0.5); }
      50% { box-shadow: 0 0 12px rgba(0, 225, 255, 0.9), inset 0 0 6px rgba(255, 255, 255, 0.65); }
    }

    body {
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      background: #020818;
      color: #B8D4FF;
      min-height: 100vh;
      padding: 2rem;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 102, 204, 0.05) 0px,
        rgba(0, 102, 204, 0.05) 1px,
        transparent 1px,
        transparent 2px
      );
      pointer-events: none;
      z-index: 1000;
    }

    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(to bottom, rgba(0, 170, 255, 0.15), transparent);
      animation: scanline1 8s linear infinite;
      pointer-events: none;
      z-index: 1001;
    }

    .scanline-2 {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(to bottom, rgba(0, 170, 255, 0.10), transparent);
      animation: scanline2 4.8s linear infinite;
      animation-delay: 2.7s;
      pointer-events: none;
      z-index: 1001;
    }

    .scanline-3 {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(to bottom, rgba(0, 170, 255, 0.08), transparent);
      animation: scanline3 13.6s linear infinite;
      animation-delay: 5.1s;
      pointer-events: none;
      z-index: 1001;
    }

    #matrix-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
    }

    .container { max-width: 800px; margin: 0 auto; }

    h1 {
      color: #00AAFF;
      margin-bottom: 2rem;
      text-align: center;
      font-family: 'VT323', monospace;
      font-size: 3rem;
      letter-spacing: 8px;
      text-transform: uppercase;
      position: relative;
      animation: glitch-title 4s infinite;
    }

    h1::before,
    h1::after {
      content: 'El Exportador';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      overflow: hidden;
      background: transparent;
    }

    h1::before {
      color: #FF0066;
      animation: glitch-title 4s infinite;
      animation-delay: 0.1s;
      clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
    }

    h1::after {
      color: #00FFFF;
      animation: glitch-title 4s infinite;
      animation-delay: 0.15s;
      clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%);
    }

    h3 {
      color: #5588BB;
      margin-bottom: 1rem;
      font-family: 'VT323', monospace;
      font-size: 1.5rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      border-bottom: 1px solid #0066CC;
      padding-bottom: 0.5rem;
    }

    .card {
      background: #050f2e;
      border: 1px solid #00AAFF;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      animation: card-border-glitch 6s infinite;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      color: #5588BB;
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    input[type="text"],
    input[type="number"],
    textarea {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #00AAFF;
      background: #050f2e;
      color: #B8D4FF;
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      font-size: 0.875rem;
      outline: none;
      caret-color: #00AAFF;
      scrollbar-width: thin;
      scrollbar-color: #00AAFF #020818;
    }

    textarea {
      resize: none;
      min-height: 180px;
    }

    textarea::-webkit-scrollbar {
      width: 12px;
    }

    textarea::-webkit-scrollbar-track {
      background: linear-gradient(180deg, #020818 0%, #050f2e 100%);
      border-left: 1px solid #0066CC;
      box-shadow: inset 0 0 8px rgba(0, 170, 255, 0.12);
    }

    textarea::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #0066CC 0%, #00AAFF 100%);
      border: 2px solid #020818;
      border-radius: 999px;
      box-shadow: 0 0 10px rgba(0, 170, 255, 0.35);
    }

    textarea::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, #00AAFF 0%, #6BE8FF 100%);
      box-shadow: 0 0 12px rgba(107, 232, 255, 0.45);
    }

    textarea::-webkit-scrollbar-corner {
      background: #020818;
    }

    input[type="text"]:focus,
    input[type="number"]:focus,
    textarea:focus {
      box-shadow: 0 0 0 1px #0066CC, 0 0 10px rgba(0, 170, 255, 0.2);
    }

    input[type="text"]::placeholder,
    textarea::placeholder {
      color: #336699;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    input[type="checkbox"] {
      appearance: none;
      width: 18px;
      height: 18px;
      border: 1px solid #00AAFF;
      background: #020818;
      cursor: pointer;
      display: grid;
      place-content: center;
      transition: background 0.15s ease, box-shadow 0.15s ease;
    }

    input[type="checkbox"]::before {
      content: '';
      width: 9px;
      height: 5px;
      border: solid #020818;
      border-width: 0 0 2px 2px;
      transform: translateY(-1px) rotate(-45deg) scale(0);
      transition: transform 0.15s ease;
    }

    input[type="checkbox"]:checked {
      background: #00E1FF;
      border-color: #6BE8FF;
      box-shadow: 0 0 8px rgba(0, 225, 255, 0.7), inset 0 0 4px rgba(255, 255, 255, 0.5);
    }

    input[type="checkbox"]:checked::before { transform: translateY(-1px) rotate(-45deg) scale(1); }

    input[type="checkbox"]:focus-visible {
      outline: 2px solid #FFFFFF;
      outline-offset: 3px;
    }

    .checkbox-group label {
      margin: 0;
      cursor: pointer;
      color: #B8D4FF;
    }

    .checkbox-group:has(#dryRun) input {
      animation: dry-run-checkbox-pulse 2.6s ease-in-out infinite;
    }

    .checkbox-group:has(#dryRun) label {
      animation: dry-run-label-pulse 2.6s ease-in-out infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .checkbox-group:has(#dryRun) input,
      .checkbox-group:has(#dryRun) label {
        animation: none;
      }
    }

    .file-upload {
      border: 2px dashed #00AAFF;
      padding: 2rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
      background: #050f2e;
    }

    .file-upload::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      border: 2px dashed #00AAFF;
      animation: dash 1s linear infinite;
      pointer-events: none;
    }

    .file-upload:hover {
      background: #0a1a40;
    }

    .file-upload input { display: none; }

    .file-upload .icon {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      color: #0066CC;
      font-family: 'VT323', monospace;
      font-size: 2.5rem;
    }

    .file-upload .hint {
      color: #336699;
      font-size: 0.875rem;
    }

    .file-upload.has-file .hint {
      display: none;
    }

    .file-upload.has-file {
      border-color: #00FF88;
      color: #00FF88;
    }

    .file-upload.has-file::before {
      border-color: #00FF88;
    }

    .file-upload .filename {
      color: #00FF88;
    }

    .file-upload.has-file::before {
      border-color: #00FF88;
    }

    .file-upload .filename {
      color: #00FF88;
      font-weight: bold;
    }

    .btn {
      width: 100%;
      padding: 1rem;
      border: 1px solid #00AAFF;
      background: #050f2e;
      color: #00AAFF;
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      font-size: 1rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 3px;
      cursor: pointer;
      transition: all 0.1s;
    }

    .btn:hover:not(:disabled) {
      background: #00AAFF;
      color: #020818;
      box-shadow: 0 0 20px rgba(0, 170, 255, 0.4);
    }

    .btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .log-container {
      background: #020818;
      border: 1px solid #0066CC;
      padding: 1rem;
      max-height: 400px;
      overflow-y: auto;
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      font-size: 0.875rem;
    }

    .log-container::-webkit-scrollbar {
      width: 8px;
    }

    .log-container::-webkit-scrollbar-track {
      background: #020818;
      border-left: 1px solid #0066CC;
    }

    .log-container::-webkit-scrollbar-thumb {
      background: #0066CC;
    }

    .log-container::-webkit-scrollbar-thumb:hover {
      background: #00AAFF;
    }

    .log-line {
      padding: 0.25rem 0;
      border-bottom: 1px solid #050f2e;
    }

    .log-line:last-child {
      border-bottom: none;
    }

    .log-prefix {
      color: #336699;
      margin-right: 0.75rem;
    }

    .log-info { color: #5588BB; }
    .log-success { color: #00FF88; }
    .log-warning { color: #FFAA00; }
    .log-error { color: #FF3366; }
    .log-progress { color: #00AAFF; }

    .progress-shell {
      margin: 0 0 1rem;
      padding: 0.85rem 1rem;
      border: 1px solid #0066CC;
      background: linear-gradient(180deg, rgba(2, 8, 24, 0.95) 0%, rgba(5, 15, 46, 0.9) 100%);
      box-shadow: inset 0 0 12px rgba(0, 170, 255, 0.06);
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 0.6rem;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #7FB7FF;
    }

    .progress-label {
      color: #5588BB;
    }

    .progress-percent {
      color: #00E1FF;
      font-weight: bold;
      min-width: 56px;
      text-align: right;
    }

    .progress-track {
      position: relative;
      height: 14px;
      overflow: hidden;
      border: 1px solid #0066CC;
      background:
        linear-gradient(90deg, rgba(0, 170, 255, 0.08) 0%, rgba(0, 170, 255, 0.02) 100%),
        #020818;
    }

    .progress-bar {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0%;
      background: linear-gradient(90deg, #0066CC 0%, #00AAFF 55%, #00FF88 100%);
      box-shadow: 0 0 12px rgba(0, 170, 255, 0.35);
      transition: width 0.2s ease;
    }

    .progress-scan {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0.0) 0,
        rgba(255,255,255,0.0) 10px,
        rgba(255,255,255,0.08) 10px,
        rgba(255,255,255,0.08) 12px
      );
      mix-blend-mode: screen;
      pointer-events: none;
    }

    .summary {
      display: flex;
      flex-wrap: nowrap;
      gap: 1rem;
      margin-top: 1rem;
      width: 100%;
      max-width: none;
      margin-left: auto;
      margin-right: auto;
    }

    .summary-item {
      flex: 1 1 0;
      min-width: 0;
      text-align: center;
      padding: 0.75rem;
      border: 1px solid #0066CC;
      background: #020818;
    }

    .summary-matched { border-color: #00FF88; }
    .summary-ambiguous { border-color: #FFAA00; }
    .summary-unmatched { border-color: #FF3366; }
    .summary-manual-additions { border-color: #C77DFF; }

    .summary-value {
      font-size: 2.25rem;
      font-weight: bold;
      font-family: 'VT323', monospace;
    }

    .summary-matched .summary-value { color: #00FF88; }
    .summary-ambiguous .summary-value { color: #FFAA00; }
    .summary-unmatched .summary-value { color: #FF3366; }
    .summary-manual-additions .summary-value { color: #C77DFF; }

    .summary-label {
      overflow: hidden;
      color: #336699;
      font-size: 0.85rem;
      text-overflow: ellipsis;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .playlist-url {
      background: #020818;
      padding: 1rem;
      border: 1px solid #00FF88;
      margin-top: 1rem;
      word-break: break-all;
      font-size: 0.875rem;
      color: #00FF88;
    }

    .playlist-url a { color: #00FF88; }

    .track-count {
      color: #336699;
      font-size: 0.875rem;
      margin-top: 0.5rem;
    }

    .config-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .config-row label {
      display: flex;
      align-items: center;
      min-height: 18px;
      margin-top: 1rem;
    }

    .help-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border: 1px solid #00AAFF;
      color: #00AAFF;
      font-family: 'VT323', monospace;
      font-size: 14px;
      margin-left: 6px;
      cursor: help;
      position: relative;
    }

    .help-icon:hover .tooltip {
      display: block;
    }

    .tooltip {
      display: none;
      position: absolute;
      bottom: 130%;
      left: 50%;
      transform: translateX(-50%);
      background: #050f2e;
      color: #B8D4FF;
      padding: 0.75rem;
      border: 1px solid #00AAFF;
      width: 280px;
      font-size: 0.8rem;
      font-family: 'Share Tech Mono', monospace;
      font-weight: normal;
      line-height: 1.4;
      z-index: 100;
      text-align: left;
      text-transform: none;
      letter-spacing: 0;
    }

    .tooltip::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 6px solid transparent;
      border-top-color: #00AAFF;
    }

    .manual-review-section {
      display: none;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }
    .manual-review-section.visible { display: block; }

    .manual-add-toast {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      z-index: 1002;
      max-width: min(360px, calc(100vw - 3rem));
      padding: 1rem 1.25rem;
      border: 1px solid #00FF88;
      background: #050f2e;
      color: #00FF88;
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      font-size: 0.875rem;
      line-height: 1.4;
      box-shadow: 0 0 12px rgba(0, 255, 136, 0.45), inset 0 0 10px rgba(0, 255, 136, 0.08);
    }

    .manual-track {
      background: #020818;
      border: 1px solid #0066CC;
      padding: 1rem;
      margin-bottom: 0.75rem;
    }

    .manual-track-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .manual-track-info {
      font-size: 0.9rem;
      color: #B8D4FF;
    }

    .manual-track-actions {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .manual-search-input {
      flex: 1;
      min-width: 150px;
      padding: 0.5rem;
      border: 1px solid #00AAFF;
      background: #050f2e;
      color: #B8D4FF;
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      font-size: 0.875rem;
    }

    .btn-small {
      padding: 0.5rem 1rem;
      border: 1px solid #00AAFF;
      background: #050f2e;
      color: #00AAFF;
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      font-size: 0.875rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-small:hover:not(:disabled) {
      background: #00AAFF;
      color: #020818;
    }

    .btn-small:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .manual-results {
      margin-top: 0.75rem;
      border-top: 1px solid #0066CC;
      padding-top: 0.75rem;
    }

    .manual-search-threshold {
      color: #7FB7FF;
      font-size: 0.7rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .manual-result-section + .manual-result-section {
      margin-top: 1rem;
      padding-top: 0.75rem;
      border-top: 1px dashed #336699;
    }

    .manual-result-heading {
      margin-bottom: 0.5rem;
      color: #7FB7FF;
      font-size: 0.75rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .manual-result-section-relaxed {
      opacity: 0.72;
    }

    .manual-result-section-relaxed .manual-result-heading {
      color: #5588BB;
    }

    .manual-result-review-reason {
      margin-top: 0.25rem;
      color: #FFAA00;
      font-size: 0.7rem;
    }

    .manual-result {
      display: block;
      width: 100%;
      padding: 0.65rem 0.75rem;
      border: 1px solid #0066CC;
      cursor: pointer;
      margin-bottom: 0.5rem;
      background: #050f2e;
      color: #B8D4FF;
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      text-align: left;
      transition: all 0.1s;
    }

    .manual-result:hover {
      border-color: #00AAFF;
      box-shadow: 0 0 10px rgba(0, 170, 255, 0.2);
    }

    .manual-result.selected {
      background: #00AAFF;
      color: #020818;
      border-color: #00AAFF;
    }

    .manual-result-title {
      color: #B8D4FF;
      font-weight: bold;
      font-size: 0.875rem;
      line-height: 1.35;
    }

    .manual-result-artist {
      font-size: 0.75rem;
      color: #5588BB;
    }

    .manual-result.selected .manual-result-artist {
      color: #020818;
    }

    .btn-add-manual {
      background: #050f2e;
      border: 1px solid #00AAFF;
      color: #00AAFF;
      margin-top: 1rem;
    }

    .btn-add-manual:hover:not(:disabled) {
      background: #00AAFF;
      color: #020818;
    }

    .ytmusic-badge {
      display: inline-block;
      background: #020818;

    function stopAuthStatusPulse() {
      authStatusShouldPulse = false;
      if (authStatusPulseTimer !== null) {
        window.clearTimeout(authStatusPulseTimer);
        authStatusPulseTimer = null;
      }
      authStatus.classList.remove('auth-status-pulse');
    }

    function scheduleAuthStatusPulse() {
      if (!authStatusShouldPulse) return;
      authStatusPulseTimer = window.setTimeout(() => {
        authStatusPulseTimer = null;
        authStatus.classList.add('auth-status-pulse');
      }, 1000 + Math.random() * 4000);
    }

    authStatus.addEventListener('animationend', (event) => {
      if (event.animationName !== 'auth-status-pulse') return;
      authStatus.classList.remove('auth-status-pulse');
      scheduleAuthStatusPulse();
    });

    function setAuthStatus(message, color, shouldPulse = false) {
      stopAuthStatusPulse();
      authStatus.textContent = message;
      authStatus.style.color = color;
      authStatusShouldPulse = shouldPulse;
      if (shouldPulse) scheduleAuthStatusPulse();
    }

    async function saveBrowserAuth() {
      try {
        const response = await fetch('/api/ytmusic-auth/browser', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ headers: "" }),
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Invalid browser headers');

        guidedBrowserAuthPanel.hidden = true;
        await checkAuthStatus();
      } catch (error) {
        setAuthStatus(t('authRequired'), '#FF4444');
        console.error('Browser authentication failed:', error);
      }
    }

    async function startGuidedAuth() {
      const response = await fetch('/api/ytmusic-auth/browser/start', { method: 'POST' });
      const result = await response.json();
      showGuidedAuthStatus(result.status);
      if (response.ok && !authPoll) pollGuidedAuth();
    }

    function showGuidedAuthStatus(status) {
      const active = ['launching', 'waiting_for_sign_in', 'validating'].includes(status);
          guidedBrowserAuthPanel.hidden = !(active || status === 'connected');
                    disconnectAuthBtn.hidden = status !== 'connected';
          if (status === 'connected') {
            setAuthStatus(t('authConnected'), '#00FF88', true);
          } else if (active) {
            setAuthStatus(t('authWaiting'), '#00AAFF');
          } else if (status === 'cancelled') {
            setAuthStatus(t('authCancelled'), '#FF4444');
          } else if (status === 'timed_out') {
            setAuthStatus(t('authTimedOut'), '#FF4444');
          } else if (status === 'error') {
            setAuthStatus(t('authFailed'), '#FF4444');
          } else {
            setAuthStatus(t('authUnauthenticated'), '#FF4444', true);
          }
        }

        async function pollGuidedAuth() {
          const response = await fetch('/api/ytmusic-auth/browser/status');
          const result = await response.json();
          showGuidedAuthStatus(result.status);
          if (['launching', 'waiting_for_sign_in', 'validating'].includes(result.status)) {
            authPoll = window.setTimeout(pollGuidedAuth, 1000);
          } else {
            authPoll = null;
            if (result.status === 'connected') await checkAuthStatus();
          }
        }

      setAuthStatus(t('authWaiting'), '#00AAFF');
      try {
        const response = await fetch('/api/ytmusic-auth/start', { method: 'POST' });
        const authorization = await response.json();
        if (!response.ok) throw new Error(authorization.error || 'Unable to start authorization');

        const authorizationUrl = new URL(authorization.verificationUrl);
        authorizationUrl.searchParams.set('user_code', authorization.userCode);
        navigator.clipboard?.writeText(authorization.userCode).catch(() => {});
        popup.location.href = authorizationUrl.toString();

        const poll = async () => {
          const pollResponse = await fetch('/api/ytmusic-auth/poll', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ authorizationId: authorization.authorizationId }),
          });
          const result = await pollResponse.json();
          if (result.status === 'authorized') {
            popup.close();
            await checkAuthStatus();
            return;
          }
          if (result.status === 'pending') {
            window.setTimeout(poll, Math.max(authorization.interval, 5) * 1000);
            return;
          }
          popup.close();
          setAuthStatus(t('authFailed'), '#FF4444');
        };
        window.setTimeout(poll, Math.max(authorization.interval, 5) * 1000);
      } catch (error) {
        popup.close();
        console.error('Unable to start YouTube Music authorization:', error);
        setAuthStatus(t('authFailed'), '#FF4444');
      }
    }

          showGuidedAuthStatus('idle');

          // Limpiar el estado global en zustand
          if (window.authStore) {
            window.authStore.getState().clearCredentials();
          }

          return false;

        console.error("Error al verificar estado de autenticación:", err);
        return false;
      }

    const redirectToAuth = () => {
      console.log('Botón de autenticación clickeado.');
      saveAuthState();
      window.location.href = `/auth`;
    };

    // Función para iniciar la conversión de la playlist
    function formatArtists(artist) {
          return Array.isArray(artist) ? artist.join(', ') : (artist || t('unknownArtist'));
        }

        function updateManualAddButton() {
          addManualBtn.disabled = manualSelections.size === 0 || !lastPlaylistId;
          addManualBtn.title = lastPlaylistId
                        ? ''
            : t('manualAdditionsUnavailable');
        }

        function showToast(message, type = 'error', id = 'appToast') {
          let toast = document.getElementById(id);
          if (!toast) {
            toast = document.createElement('div');
            toast.id = id;
            document.body.appendChild(toast);
          }
          toast.className = type === 'success' ? 'manual-add-toast' : 'manual-add-toast toast-error';
          toast.setAttribute('role', type === 'error' ? 'alert' : 'status');
          toast.setAttribute('aria-live', type === 'error' ? 'assertive' : 'polite');
          toast.textContent = message;
          const timer = toastTimers.get(id);
          if (timer !== undefined) window.clearTimeout(timer);
          toastTimers.set(id, window.setTimeout(() => {
            toast.remove();
            toastTimers.delete(id);
          }, 4000));
        }

        function showManualAddToast(count) {
          showToast(t('tracksAdded', { count, plural: count === 1 ? '' : 's' }), 'success', 'manualAddToast');
        }

        function updateManualAdditionsSummary() {
          let item = document.getElementById('manualAdditionsSummary');
          if (!item) {
            item = document.createElement('div');
            item.id = 'manualAdditionsSummary';
            item.className = 'summary-item summary-manual-additions';
            const label = document.createElement('div');
            label.className = 'summary-label';
            label.textContent = t('manualAdditions');
            const value = document.createElement('div');
            value.className = 'summary-value';
            item.append(label, value);
            summaryGrid.appendChild(item);
          }
          item.querySelector('.summary-value').textContent = String(manualAdditionsCount);
        }

        function selectManualCandidate(trackId, candidate, candidateList) {
          manualSelections.set(trackId, candidate);
          candidateList.querySelectorAll('.manual-result').forEach((element) => {
            element.classList.toggle('selected', element.dataset.videoId === candidate.videoId);
          });
          updateManualAddButton();
        }

        function appendManualCandidate(trackId, candidate, candidateList, section) {
          if (!candidate || !candidate.videoId) return;
          const option = document.createElement('button');
          option.type = 'button';
          option.className = 'manual-result';
          option.dataset.videoId = candidate.videoId;

          const title = document.createElement('div');
          title.className = 'manual-result-title';
          title.textContent = candidate.title || t('untitledTrack');
          const artist = document.createElement('div');
          artist.className = 'manual-result-artist';
          artist.textContent = formatArtists(candidate.artist);
          option.append(title, artist);
          if (candidate.reviewReason) {
            const reason = document.createElement('div');
            reason.className = 'manual-result-review-reason';
            reason.textContent = t('verifyCandidate');
            option.appendChild(reason);
          }
          option.addEventListener('click', () => selectManualCandidate(trackId, candidate, candidateList));
          section.appendChild(option);
        }

        function appendManualResultSection(trackId, candidates, candidateList, heading, relaxed = false) {
          if (!candidates.length) return;
          const section = document.createElement('div');
          section.className = `manual-result-section${relaxed ? ' manual-result-section-relaxed' : ''}`;
          const label = document.createElement('div');
          label.className = 'manual-result-heading';
          label.textContent = heading;
          section.appendChild(label);
          candidates.forEach((candidate) => appendManualCandidate(trackId, candidate, candidateList, section));
          candidateList.appendChild(section);
        }

        function renderManualCandidates(trackId, strictCandidates, relaxedCandidates, candidateList) {
          candidateList.replaceChildren();
          const seenVideoIds = new Set();
          const uniqueCandidates = (candidates) => candidates.filter((candidate) => {
            if (!candidate || !candidate.videoId || seenVideoIds.has(candidate.videoId)) return false;
            seenVideoIds.add(candidate.videoId);
            return true;
          });
          appendManualResultSection(
            trackId, uniqueCandidates(strictCandidates), candidateList, t('recommendedResults')
          );
          appendManualResultSection(
            trackId, uniqueCandidates(relaxedCandidates), candidateList,
            t('otherResults'), true
          );
          if (!candidateList.childElementCount) {
            const noResults = document.createElement('div');
            noResults.className = 'manual-result-artist';
            noResults.textContent = t('noMatches');
            candidateList.appendChild(noResults);
          }
        }

        function cancelManualSearches() {
              manualSearchRequests.forEach((request) => request.controller.abort());
              manualSearchRequests.clear();
            }

            function nextManualSearch(trackId, query, artist, title) {
          const prior = manualSearchStates.get(trackId);
          if (!prior || prior.query !== query || prior.artist !== artist || prior.title !== title) {
            return { threshold: 0, offset: 0, exhausted: false };
          }
          if (prior.hasMore && prior.offset < 10) return { threshold: prior.threshold, offset: prior.offset + 5, exhausted: false };
          if (prior.candidateCount === 5) {
            return { threshold: Math.round(Math.min(prior.threshold + 0.15, 0.60) * 100) / 100, offset: 0, exhausted: false };
          }
          return { threshold: prior.threshold, offset: prior.offset, exhausted: true };
        }

        function showManualSearchThreshold(element, threshold, offset = 0, candidateCount = 0, exhausted = false) {
          const range = t('resultsRange', { from: offset + 1, to: offset + (candidateCount || 5) });
          element.textContent = t('searchThreshold', { threshold: threshold.toFixed(2), range, more: exhausted ? t('noMoreResults') : '' });
        }

        async function searchManualTrack(trackId, query, expectedArtist, expectedTitle, candidateList, searchButton, thresholdDisplay) {
          if (!query || manualSearchRequests.has(trackId)) return;
          const search = nextManualSearch(trackId, query, expectedArtist, expectedTitle);
          if (search.exhausted) {
            showManualSearchThreshold(thresholdDisplay, search.threshold, search.offset, 0, true);
            return;
          }
          const { threshold: searchThreshold, offset } = search;
          showManualSearchThreshold(thresholdDisplay, searchThreshold, offset);
              const request = {
                controller: new AbortController(),
                version: Number(searchButton.dataset.searchVersion || 0) + 1,
              };
              searchButton.dataset.searchVersion = String(request.version);
              manualSearchRequests.set(trackId, request);
          manualSelections.delete(trackId);
          updateManualAddButton();
          searchButton.disabled = true;
              searchButton.setAttribute('aria-busy', 'true');
              const buttonText = searchButton.textContent;
              searchButton.textContent = t('searching');
              const isCurrentRequest = () => manualSearchRequests.get(trackId) === request
                && Number(searchButton.dataset.searchVersion) === request.version;
          try {
            const response = await fetch('/api/search-single', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ query, artist: expectedArtist, title: expectedTitle, threshold: searchThreshold, offset }),
                  signal: request.controller.signal,
            });
            const payload = await response.json();
            if (!response.ok) throw new Error(payload.error || 'Search failed');
                if (!isCurrentRequest()) return;
            const results = payload.results || [];
            manualSearchStates.set(trackId, {
              query,
              artist: expectedArtist,
              title: expectedTitle,
              threshold: searchThreshold,
              offset,
              candidateCount: results.length,
              hasMore: payload.hasMore === true,
            });
            showManualSearchThreshold(thresholdDisplay, searchThreshold, offset, results.length);
            renderManualCandidates(trackId, results, [], candidateList);
          } catch (error) {
            if (error && error.name === 'AbortError') return;
                if (!isCurrentRequest()) return;
                console.error('Manual search failed:', error);
            const failed = document.createElement('div');
            failed.className = 'manual-result-artist';
            failed.textContent = t('searchFailed');
            candidateList.replaceChildren(failed);
          } finally {
            if (isCurrentRequest()) {
                  manualSearchRequests.delete(trackId);
                  searchButton.disabled = false;
                  searchButton.removeAttribute('aria-busy');
                  searchButton.textContent = buttonText;
                }
          }
        }

        function showManualReview() {
              cancelManualSearches();
              manualSearchStates.clear();
          manualTracksList.replaceChildren();
          if (!lastConversionResults.length) {
            manualReviewSection.classList.remove('visible');
            updateManualAddButton();
            return;
          }
          manualReviewSection.classList.add('visible');
          manualReviewDescription.textContent = lastPlaylistId
            ? t('chooseSuggestion')
            : t('chooseBeforeAdding');

          lastConversionResults.forEach((track, index) => {
            const trackId = `review-${index}`;
            const card = document.createElement('div');
            card.className = 'manual-track';
            const header = document.createElement('div');
            header.className = 'manual-track-header';
            const info = document.createElement('div');
            info.className = 'manual-track-info';
            const statusKeys = {
              unmatched: 'trackStatusUnmatched',
              ambiguous: 'trackStatusAmbiguous',
              manual_review: 'trackStatusManualReview'
            };
            info.textContent = `${track.artist || t('unknownArtist')} — ${track.title || t('untitledTrack')} (${t(statusKeys[track.status] || 'trackStatusUnknown')})`;
            header.appendChild(info);

            const actions = document.createElement('div');
            actions.className = 'manual-track-actions';
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'manual-search-input';
            input.value = [track.artist, track.title].filter(Boolean).join(' ');
            input.setAttribute('aria-label', t('searchMatch', { title: track.title || t('untitledTrack') }));
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'btn-small';
            button.textContent = '[ SEARCH ]';
            const thresholdDisplay = document.createElement('div');
            thresholdDisplay.className = 'manual-search-threshold';
            showManualSearchThreshold(thresholdDisplay, 0);
            actions.append(input, button, thresholdDisplay);
            header.appendChild(actions);
            card.appendChild(header);

            const candidates = document.createElement('div');
            candidates.className = 'manual-results';
            const initialCandidates = [track.bestMatch, ...(track.alternatives || [])]
              .filter(Boolean);
            if (initialCandidates.length) {
              renderManualCandidates(trackId, initialCandidates, [], candidates);
            } else {
              const prompt = document.createElement('div');
              prompt.className = 'manual-result-artist';
              prompt.textContent = t('noSuggestedMatch');
              candidates.appendChild(prompt);
            }
            button.addEventListener('click', () => searchManualTrack(
              trackId, input.value.trim(), track.artist, track.title, candidates, button, thresholdDisplay
            ));
            input.addEventListener('input', () => {
              const activeRequest = manualSearchRequests.get(trackId);
              if (activeRequest) {
                button.dataset.searchVersion = String(Number(button.dataset.searchVersion || 0) + 1);
                activeRequest.controller.abort();
                manualSearchRequests.delete(trackId);
                button.disabled = false;
                button.removeAttribute('aria-busy');
                button.textContent = '[ SEARCH ]';
              }
              manualSearchStates.delete(trackId);
              showManualSearchThreshold(thresholdDisplay, 0);
            });
            input.addEventListener('keydown', (event) => {
              if (event.key !== 'Enter') return;
                  event.preventDefault();
                  searchManualTrack(
                trackId, input.value.trim(), track.artist, track.title, candidates, button, thresholdDisplay
              );
            });
            card.append(candidates);
            manualTracksList.appendChild(card);
          });
          updateManualAddButton();
        }

        addManualBtn.addEventListener('click', async () => {
          if (!lastPlaylistId || !manualSelections.size) return;
          const tracks = [...new Map(
            [...manualSelections.values()].map((track) => [track.videoId, track])
          ).values()];
              manualAddStatus.style.display = 'none';
          addManualBtn.disabled = true;
          try {
            const response = await fetch('/api/add-to-playlist', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ playlistId: lastPlaylistId, tracks }),
            });
            const payload = await response.json();
            if (!response.ok || payload?.success !== true || !Number.isInteger(payload?.count) || payload.count !== tracks.length) {
                  throw new Error(payload?.error || 'Could not confirm all selected tracks were added');
                }

            const addedCount = payload.count;
            const selectedTrackIds = new Set(manualSelections.keys());
            manualAdditionsCount += addedCount;
            manualAddStatus.style.display = 'none';
            showManualAddToast(addedCount);
            updateManualAdditionsSummary();
            lastConversionResults = lastConversionResults.filter((track, index) =>
              !selectedTrackIds.has(`review-${index}`)
            );
            manualSelections.clear();
            showManualReview();
          } catch (error) {
            console.error('Adding manual selections failed:', error);
                manualAddStatus.textContent = t('couldNotAdd');
                manualAddStatus.style.color = '#FF3366';
                manualAddStatus.style.display = 'block';
            updateManualAddButton();
          }
        });

        const startConversion = async () => {
      if (!window.parsedTracks || window.parsedTracks.length === 0) {
        showToast(t('noTracks'));
        return;
      }

      const playlistNameValue = playlistName.value.trim();
      if (!playlistNameValue) {
        showToast(t('playlistRequired'));
        return;
      }

      // Deshabilitar el botón durante la conversión
      startBtn.disabled = true;
      startBtn.textContent = t('processing');

      // Clear the previous conversion summary.
      summaryCard.style.display = "none";
          lastPlaylistId = null;
          manualAdditionsCount = 0;
          const manualToastTimer = toastTimers.get('manualAddToast');
          if (manualToastTimer !== undefined) {
            window.clearTimeout(manualToastTimer);
            toastTimers.delete('manualAddToast');
          }
          document.getElementById('manualAddToast')?.remove();
          manualAddStatus.style.display = 'none';
          playlistUrl.style.display = "none";
              cancelManualSearches();
          manualSelections.clear();
          manualTracksList.replaceChildren();
          manualReviewSection.classList.remove('visible');
          addManualBtn.disabled = true;

      // Configurar la barra de progreso
      latestProcessedCount = 0;
      latestProgressTotal = 0;
      progressBar.style.width = "0%";
      progressPercent.textContent = "0%";
      progressLabel.textContent = t('starting');

      try {
        // Crear EventSource para recibir actualizaciones de progreso
        eventSource = new EventSource(`/api/convert-progress?playlistName=${encodeURIComponent(playlistNameValue)}&dryRun=${dryRun.checked}&threshold=${threshold.value}`);

        eventSource.onmessage = (event) => {
          const data = JSON.parse(event.data);
          if (data.type === "progress") {
            const added = Number(data.added);
            const total = Number(data.total);
            const isValidProgress = Number.isFinite(added) && Number.isFinite(total) && total > 0;

            if (latestProgressTotal > 0 && latestProcessedCount >= latestProgressTotal) return;
            if (isValidProgress && latestProgressTotal === total && added < latestProcessedCount) return;

            if (isValidProgress) {
              latestProcessedCount = added;
              latestProgressTotal = total;
            }

            const percent = Math.round((added / total) * 100);
            progressBar.style.width = `${percent}%`;
            progressPercent.textContent = `${percent}%`;
            // Progress events only move the bar. The label is reserved for the active search.
            if (data.artist && data.title) {
              progressLabel.textContent = t('searchingTrack', { artist: data.artist, title: data.title });
            }
            backendStatus.lastElementChild.textContent = t('backendSearching');
            backendStatus.firstElementChild.className = 'backend-dot available';
          } else if (data.type === "result") {
            progressBar.style.width = "100%";
            progressPercent.textContent = "100%";
            progressLabel.textContent = t('completed');
            progressBar.parentElement.setAttribute("aria-valuenow", "100");
            backendStatus.lastElementChild.textContent = t('conversionCompleted');
            backendStatus.firstElementChild.className = "backend-dot available";
            eventSource.close();
            startBtn.disabled = false;
            startBtn.textContent = "[ EXECUTE ]";

            // Mostrar resumen solo al finalizar
            summaryCard.style.display = "block";
            summaryGrid.replaceChildren();
            [['matched', data.matched], ['unmatched', data.unmatched], ['ambiguous', data.ambiguous]].forEach(([key, value]) => {
              const item = document.createElement('div');
              item.className = `summary-item summary-${key}`;
              const label = document.createElement('div');
              label.className = 'summary-label';
              label.textContent = t(key);
              const count = document.createElement('div');
              count.className = 'summary-value';
              count.textContent = String(value);
              item.append(label, count);
              summaryGrid.appendChild(item);
            });

            if (data.playlistUrl) {
              playlistUrl.replaceChildren(`${t('playlistUrl')} `);
              const link = document.createElement('a');
              link.href = data.playlistUrl;
              link.target = '_blank';
              link.rel = 'noopener noreferrer';
              link.textContent = data.playlistUrl;
              playlistUrl.appendChild(link);
              playlistUrl.style.display = "block";
            }

            // Guardar resultados para revisión manual
            lastPlaylistId = data.playlistId || null;
                lastConversionResults = data.manualReviewTracks || [
                  ...(data.unmatchedTracks || []),
                  ...(data.ambiguousTracks || []),
                ];
            if (lastConversionResults.length > 0) {
              showManualReview();
            }
          }
        };

        eventSource.onerror = (err) => {
          console.error("EventSource failed:", err);
          eventSource.close();

          // Rehabilitar el botón
          startBtn.disabled = false;
          startBtn.textContent = "[ EXECUTE ]";

          showToast(t('conversionError'));
        };

        await new Promise((resolve, reject) => {
          const timeout = setTimeout(() => reject(new Error('Progress stream timed out')), 5000);
          eventSource.onopen = () => {
            clearTimeout(timeout);
            backendStatus.lastElementChild.textContent = t('backendConnected');
            backendStatus.firstElementChild.className = 'backend-dot available';
            resolve();
          };
        });

        // Send tracks only after the progress stream is connected.
        const response = await fetch('/api/convert', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            tracks: window.parsedTracks,
            playlistName: playlistNameValue,
            dryRun: dryRun.checked,
            threshold: parseInt(threshold.value)
          })
        });

        if (!response.ok) {
          throw new Error(`Server error: ${response.statusText}`);
        }

      } catch (err) {
        console.error("Error durante la conversión:", err);
        showToast(t('conversionError'));

        // Rehabilitar el botón
        startBtn.disabled = false;
        startBtn.textContent = "[ EXECUTE ]";
      }
    };

    // Asignar el evento onclick al botón [EXECUTE]
    startBtn.onclick = startConversion;

    // Restaurar estado desde localStorage al cargar la página
    const restoreState = () => {
      console.log('Iniciando restauración de estado...');
      const savedState = localStorage.getItem('m3uState');
      if (!savedState) {
        console.log('No hay estado guardado en localStorage.');
        return;
      }
      console.log('Estado guardado en localStorage:', savedState);
      const state = JSON.parse(savedState);
      const now = new Date();
      const stateTime = new Date(state.timestamp);
      const oneHour = 60 * 60 * 1000;
      if (now - stateTime > oneHour) {
        console.log('Estado caducado. Limpiando localStorage.');
        localStorage.removeItem('m3uState');
        return;
      }
      if (state.file) {
        console.log('Restaurando [File]:', state.file);
        dropZone.classList.add('has-file');
        uploadText.replaceChildren();
            const restoredFilename = document.createElement('span');
            restoredFilename.className = 'filename';
            restoredFilename.textContent = `[OK] ${state.file}`;
            uploadText.appendChild(restoredFilename);
        dropZone.style.borderColor = '#00FF88';
        dropZone.style.color = '#00FF88';
        dropZone.style.backgroundColor = 'rgba(0, 255, 136, 0.1)';
      }
      if (state.m3uContent) {
        console.log('Restaurando m3uContent.');
        m3uContent.value = state.m3uContent;
      }
      if (state.playlistName) {
        console.log('Restaurando playlistName:', state.playlistName);
        playlistName.value = state.playlistName;
      }
    };

    // Escuchar mensajes del popup de autenticación
    window.addEventListener('message', async (event) => {
      console.info('[auth] Window message received');

      // Verificar el origen del mensaje para evitar problemas de seguridad
      if (event.origin !== 'http://localhost:3000') {
        console.warn('[auth] Window message rejected: invalid origin');
        return;
      }

      if (event.data.type === 'auth_success') {
        console.info('[auth] Authentication success message received');
        const token = event.data.token;

        // Validar el token en el backend
        try {
          console.info('[auth] Token validation requested');
          const response = await fetch('/auth/validate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token })
          });
          const data = await response.json();


           if (data.valid) {
             console.info('[auth] Token validation accepted');
             // Actualizar el estado de autenticación
             if (window.authStore) {
               window.authStore.getState().setCredentials(token, "youtube");
             }
             const isAuthenticated = await checkAuthStatus();

             // Habilitar el botón [EXECUTE] si hay un archivo cargado
             if (isAuthenticated && dropZone.classList.contains('has-file')) {
               startBtn.disabled = false;
             }
           } else {
             console.error('[auth] Token validation rejected');
           }
        } catch (err) {
          console.error('[auth] Token validation failed');
        }
      } else if (event.data === 'auth_error') {
        console.error('[auth] Authentication error message received');
        showToast(t('authFailed'));
      } else {
        console.warn('[auth] Unknown window message received');
      }
    });

    // Llamar a checkAuthStatus al cargar la página
    document.addEventListener('DOMContentLoaded', () => {
      checkAuthStatus();

      // Verificar si hay un parámetro de autenticación
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.has('auth')) {
        const authStatus = urlParams.get('auth');
        if (authStatus === 'success') {
          console.log('Autenticación exitosa detectada');
          checkAuthStatus(); // Verificar el estado nuevamente
        } else if (authStatus === 'error') {
          showToast(t('authFailed'));
        }
        // Limpiar el parámetro de la URL
        window.history.replaceState({}, document.title, '/');
      }
    });

    // Verificar si la autenticación fue cancelada
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('cancelled')) {
      localStorage.removeItem('m3uState');
      window.location.search = '';
    }
  </script>

  <script>
    // Matrix animation
    (function() {
      const canvas = document.getElementById('matrix-canvas');
      const ctx = canvas.getContext('2d');
      const CHARS = '0アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン1';
      const FONT_SIZE = 14;
      const CHAR_COLOR = '#003366';
      const HEAD_COLOR = '#0066AA';
      let columns = [];
      let width, height;

      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        const colCount = Math.floor(width / FONT_SIZE);
        columns = [];
        for (let i = 0; i < colCount; i++) {
          columns.push({
            x: i * FONT_SIZE,
            y: Math.random() * height,
            speed: 1 + Math.random() * 2,
            chars: []
          });
        }
      }

      function getRandomChar() {
        return CHARS[Math.floor(Math.random() * CHARS.length)];
      }

      function draw() {
        ctx.fillStyle = 'rgba(2, 8, 24, 0.05)';
        ctx.fillRect(0, 0, width, height);
        ctx.font = `${FONT_SIZE}px 'Share Tech Mono', monospace`;
        columns.forEach(col => {
          for (let i = 0; i < col.chars.length; i++) {
            const charY = col.y - i * FONT_SIZE;
            if (charY < 0 || charY > height) continue;
            if (i === 0) {
              ctx.fillStyle = HEAD_COLOR;
            } else {
              const alpha = 0.3 + (1 - i / col.chars.length) * 0.5;
              ctx.fillStyle = CHAR_COLOR;
              ctx.globalAlpha = alpha;
            }
            ctx.fillText(col.chars[i], col.x, charY);
          }
          ctx.globalAlpha = 1;
          col.y += col.speed;
          if (Math.random() < 0.08) {
            if (col.chars.length === 0 || col.chars[0] !== getRandomChar()) {
              col.chars.unshift(getRandomChar());
            }
          }
          if (Math.random() < 0.04) {
            col.chars.pop();
          }
          if (col.y - col.chars.length * FONT_SIZE > height + FONT_SIZE * 10) {
            col.y = -FONT_SIZE * (5 + Math.floor(Math.random() * 20));
            col.chars = [];
          }
        });
        requestAnimationFrame(draw);
      }

      resize();
      window.addEventListener('resize', resize);
      draw();
    })();
  </script>
