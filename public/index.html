<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Exportador</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323:wght@400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    @keyframes glitch-title {
      0%, 100% { text-shadow: none; transform: translate(0); clip-path: none; }
      92% { text-shadow: none; transform: translate(0); clip-path: none; }
      93% { text-shadow: -3px 0 #FF0066, 3px 0 #00FFFF; transform: translate(2px, 0); clip-path: polygon(0 20%, 100% 20%, 100% 40%, 0 40%); }
      94% { text-shadow: 3px 0 #FF0066, -3px 0 #00FFFF; transform: translate(-2px, 0); clip-path: polygon(0 60%, 100% 60%, 100% 80%, 0 80%); }
      95% { text-shadow: -2px 0 #00FFFF, 2px 0 #FF0066; transform: translate(1px, 0); clip-path: polygon(0 10%, 100% 10%, 100% 30%, 0 30%); }
      96% { text-shadow: 2px 0 #FF0066, -2px 0 #00FFFF; transform: translate(-1px, 0); clip-path: none; }
      97% { text-shadow: none; transform: translate(0); clip-path: none; }
    }

    @keyframes card-border-glitch {
      0%, 100% { border-color: #00AAFF; box-shadow: 0 0 0 transparent; }
      96% { border-color: #00AAFF; box-shadow: 0 0 0 transparent; }
      97% { border-color: #FFFFFF; box-shadow: 0 0 15px #00AAFF, 0 0 30px rgba(0, 170, 255, 0.3); }
      98% { border-color: #00AAFF; box-shadow: 0 0 0 transparent; }
    }

    @keyframes dash {
      to { stroke-dashoffset: -20; }
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    @keyframes auth-status-pulse {
      0% { opacity: 0.82; filter: brightness(0.9); text-shadow: 0 0 0 transparent; }
      20% { opacity: 1; filter: brightness(1.65); text-shadow: 0 0 12px currentColor, 0 0 24px currentColor; }
      100% { opacity: 0.82; filter: brightness(0.9); text-shadow: 0 0 0 transparent; }
    }

    #authStatus.auth-status-pulse {
      animation: auth-status-pulse 4.5s ease-out;
    }

    body {
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      background: #020818;
      color: #B8D4FF;
      min-height: 100vh;
      padding: 2rem;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 102, 204, 0.05) 0px,
        rgba(0, 102, 204, 0.05) 1px,
        transparent 1px,
        transparent 2px
      );
      pointer-events: none;
      z-index: 1000;
    }

    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(to bottom, rgba(0, 170, 255, 0.15), transparent);
      animation: scanline1 8s linear infinite;
      pointer-events: none;
      z-index: 1001;
    }

    .scanline-2 {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(to bottom, rgba(0, 170, 255, 0.10), transparent);
      animation: scanline2 4.8s linear infinite;
      animation-delay: 2.7s;
      pointer-events: none;
      z-index: 1001;
    }

    .scanline-3 {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(to bottom, rgba(0, 170, 255, 0.08), transparent);
      animation: scanline3 13.6s linear infinite;
      animation-delay: 5.1s;
      pointer-events: none;
      z-index: 1001;
    }

    #matrix-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
    }

    .container { max-width: 800px; margin: 0 auto; }

    h1 {
      color: #00AAFF;
      margin-bottom: 2rem;
      text-align: center;
      font-family: 'VT323', monospace;
      font-size: 3rem;
      letter-spacing: 8px;
      text-transform: uppercase;
      position: relative;
      animation: glitch-title 4s infinite;
    }

    h1::before,
    h1::after {
      content: 'El Exportador';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      overflow: hidden;
      background: transparent;
    }

    h1::before {
      color: #FF0066;
      animation: glitch-title 4s infinite;
      animation-delay: 0.1s;
      clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
    }

    h1::after {
      color: #00FFFF;
      animation: glitch-title 4s infinite;
      animation-delay: 0.15s;
      clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%);
    }

    h3 {
      color: #5588BB;
      margin-bottom: 1rem;
      font-family: 'VT323', monospace;
      font-size: 1.5rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      border-bottom: 1px solid #0066CC;
      padding-bottom: 0.5rem;
    }

    .card {
      background: #050f2e;
      border: 1px solid #00AAFF;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      animation: card-border-glitch 6s infinite;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      color: #5588BB;
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    input[type="text"],
    input[type="number"],
    textarea {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #00AAFF;
      background: #050f2e;
      color: #B8D4FF;
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      font-size: 0.875rem;
      outline: none;
      caret-color: #00AAFF;
      scrollbar-width: thin;
      scrollbar-color: #00AAFF #020818;
    }

    textarea {
      resize: none;
      min-height: 180px;
    }

    textarea::-webkit-scrollbar {
      width: 12px;
    }

    textarea::-webkit-scrollbar-track {
      background: linear-gradient(180deg, #020818 0%, #050f2e 100%);
      border-left: 1px solid #0066CC;
      box-shadow: inset 0 0 8px rgba(0, 170, 255, 0.12);
    }

    textarea::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #0066CC 0%, #00AAFF 100%);
      border: 2px solid #020818;
      border-radius: 999px;
      box-shadow: 0 0 10px rgba(0, 170, 255, 0.35);
    }

    textarea::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, #00AAFF 0%, #6BE8FF 100%);
      box-shadow: 0 0 12px rgba(107, 232, 255, 0.45);
    }

    textarea::-webkit-scrollbar-corner {
      background: #020818;
    }

    input[type="text"]:focus,
    input[type="number"]:focus,
    textarea:focus {
      box-shadow: 0 0 0 1px #0066CC, 0 0 10px rgba(0, 170, 255, 0.2);
    }

    input[type="text"]::placeholder,
    textarea::placeholder {
      color: #336699;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #00AAFF;
      cursor: pointer;
    }

    .checkbox-group label {
      margin: 0;
      cursor: pointer;
      color: #B8D4FF;
    }

    .file-upload {
      border: 2px dashed #00AAFF;
      padding: 2rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
      background: #050f2e;
    }

    .file-upload::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      border: 2px dashed #00AAFF;
      animation: dash 1s linear infinite;
      pointer-events: none;
    }

    .file-upload:hover {
      background: #0a1a40;
    }

    .file-upload input { display: none; }

    .file-upload .icon {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      color: #0066CC;
      font-family: 'VT323', monospace;
      font-size: 2.5rem;
    }

    .file-upload .hint {
      color: #336699;
      font-size: 0.875rem;
    }

    .file-upload.has-file {
      border-color: #00FF88;
      color: #00FF88;
    }

    .file-upload.has-file::before {
      border-color: #00FF88;
    }

    .file-upload .filename {
      color: #00FF88;
    }

    .file-upload.has-file::before {
      border-color: #00FF88;
    }

    .file-upload .filename {
      color: #00FF88;
      font-weight: bold;
    }

    .btn {
      width: 100%;
      padding: 1rem;
      border: 1px solid #00AAFF;
      background: #050f2e;
      color: #00AAFF;
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      font-size: 1rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 3px;
      cursor: pointer;
      transition: all 0.1s;
    }

    .btn:hover:not(:disabled) {
      background: #00AAFF;
      color: #020818;
      box-shadow: 0 0 20px rgba(0, 170, 255, 0.4);
    }

    .btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .log-container {
      background: #020818;
      border: 1px solid #0066CC;
      padding: 1rem;
      max-height: 400px;
      overflow-y: auto;
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      font-size: 0.875rem;
    }

    .log-container::-webkit-scrollbar {
      width: 8px;
    }

    .log-container::-webkit-scrollbar-track {
      background: #020818;
      border-left: 1px solid #0066CC;
    }

    .log-container::-webkit-scrollbar-thumb {
      background: #0066CC;
    }

    .log-container::-webkit-scrollbar-thumb:hover {
      background: #00AAFF;
    }

    .log-line {
      padding: 0.25rem 0;
      border-bottom: 1px solid #050f2e;
    }

    .log-line:last-child {
      border-bottom: none;
    }

    .log-prefix {
      color: #336699;
      margin-right: 0.75rem;
    }

    .log-info { color: #5588BB; }
    .log-success { color: #00FF88; }
    .log-warning { color: #FFAA00; }
    .log-error { color: #FF3366; }
    .log-progress { color: #00AAFF; }

    .progress-shell {
      margin: 0 0 1rem;
      padding: 0.85rem 1rem;
      border: 1px solid #0066CC;
      background: linear-gradient(180deg, rgba(2, 8, 24, 0.95) 0%, rgba(5, 15, 46, 0.9) 100%);
      box-shadow: inset 0 0 12px rgba(0, 170, 255, 0.06);
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 0.6rem;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #7FB7FF;
    }

    .progress-label {
      color: #5588BB;
    }

    .progress-percent {
      color: #00E1FF;
      font-weight: bold;
      min-width: 56px;
      text-align: right;
    }

    .progress-track {
      position: relative;
      height: 14px;
      overflow: hidden;
      border: 1px solid #0066CC;
      background:
        linear-gradient(90deg, rgba(0, 170, 255, 0.08) 0%, rgba(0, 170, 255, 0.02) 100%),
        #020818;
    }

    .progress-bar {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0%;
      background: linear-gradient(90deg, #0066CC 0%, #00AAFF 55%, #00FF88 100%);
      box-shadow: 0 0 12px rgba(0, 170, 255, 0.35);
      transition: width 0.2s ease;
    }

    .progress-scan {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0.0) 0,
        rgba(255,255,255,0.0) 10px,
        rgba(255,255,255,0.08) 10px,
        rgba(255,255,255,0.08) 12px
      );
      mix-blend-mode: screen;
      pointer-events: none;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-top: 1rem;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    .summary-item {
      text-align: center;
      padding: 1rem;
      border: 1px solid #0066CC;
      background: #020818;
    }

    .summary-matched { border-color: #00FF88; }
    .summary-ambiguous { border-color: #FFAA00; }
    .summary-unmatched { border-color: #FF3366; }

    .summary-value {
      font-size: 2rem;
      font-weight: bold;
      font-family: 'VT323', monospace;
    }

    .summary-matched .summary-value { color: #00FF88; }
    .summary-ambiguous .summary-value { color: #FFAA00; }
    .summary-unmatched .summary-value { color: #FF3366; }

    .summary-label {
      color: #336699;
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .playlist-url {
      background: #020818;
      padding: 1rem;
      border: 1px solid #00FF88;
      margin-top: 1rem;
      word-break: break-all;
      font-size: 0.875rem;
      color: #00FF88;
    }

    .playlist-url a { color: #00FF88; }

    .track-count {
      color: #336699;
      font-size: 0.875rem;
      margin-top: 0.5rem;
    }

    .config-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .config-row label { margin-top: 1rem; }

    .help-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border: 1px solid #00AAFF;
      color: #00AAFF;
      font-family: 'VT323', monospace;
      font-size: 14px;
      margin-left: 6px;
      cursor: help;
      position: relative;
    }

    .help-icon:hover .tooltip {
      display: block;
    }

    .tooltip {
      display: none;
      position: absolute;
      bottom: 130%;
      left: 50%;
      transform: translateX(-50%);
      background: #050f2e;
      color: #B8D4FF;
      padding: 0.75rem;
      border: 1px solid #00AAFF;
      width: 280px;
      font-size: 0.8rem;
      font-family: 'Share Tech Mono', monospace;
      font-weight: normal;
      line-height: 1.4;
      z-index: 100;
      text-align: left;
      text-transform: none;
      letter-spacing: 0;
    }

    .tooltip::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 6px solid transparent;
      border-top-color: #00AAFF;
    }

    .manual-review-section {
      display: none;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }
    .manual-review-section.visible { display: block; }

    .manual-track {
      background: #020818;
      border: 1px solid #0066CC;
      padding: 1rem;
      margin-bottom: 0.75rem;
    }

    .manual-track-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .manual-track-info {
      font-size: 0.9rem;
      color: #B8D4FF;
    }

    .manual-track-actions {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .manual-search-input {
      flex: 1;
      min-width: 150px;
      padding: 0.5rem;
      border: 1px solid #00AAFF;
      background: #050f2e;
      color: #B8D4FF;
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      font-size: 0.875rem;
    }

    .btn-small {
      padding: 0.5rem 1rem;
      border: 1px solid #00AAFF;
      background: #050f2e;
      color: #00AAFF;
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      font-size: 0.875rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-small:hover:not(:disabled) {
      background: #00AAFF;
      color: #020818;
    }

    .btn-small:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .manual-results {
      margin-top: 0.75rem;
      border-top: 1px solid #0066CC;
      padding-top: 0.75rem;
    }

    .manual-result {
      display: block;
      width: 100%;
      padding: 0.65rem 0.75rem;
      border: 1px solid #0066CC;
      cursor: pointer;
      margin-bottom: 0.5rem;
      background: #050f2e;
      color: #B8D4FF;
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      text-align: left;
      transition: all 0.1s;
    }

    .manual-result:hover {
      border-color: #00AAFF;
      box-shadow: 0 0 10px rgba(0, 170, 255, 0.2);
    }

    .manual-result.selected {
      background: #00AAFF;
      color: #020818;
      border-color: #00AAFF;
    }

    .manual-result-title {
      color: #B8D4FF;
      font-weight: bold;
      font-size: 0.875rem;
      line-height: 1.35;
    }

    .manual-result-artist {
      font-size: 0.75rem;
      color: #5588BB;
    }

    .manual-result.selected .manual-result-artist {
      color: #020818;
    }

    .btn-add-manual {
      background: #050f2e;
      border: 1px solid #00AAFF;
      color: #00AAFF;
      margin-top: 1rem;
    }

    .btn-add-manual:hover:not(:disabled) {
      background: #00AAFF;
      color: #020818;
    }

    .ytmusic-badge {
      display: inline-block;
      background: #020818;
      color: #FFAA00;
      padding: 0.2rem 0.5rem;
      border: 1px solid #FFAA00;
      font-size: 0.7rem;
      margin-left: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .backend-status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      color: #336699;
      margin-top: 0.5rem;
    }

    .backend-dot {
      width: 8px;
      height: 8px;
      border: 1px solid #00AAFF;
    }

    .backend-dot.available {
      background: #00FF88;
      border-color: #00FF88;
      box-shadow: 0 0 6px #00FF88;
    }

    .backend-dot.unavailable {
      background: #FF3366;
      border-color: #FF3366;
      box-shadow: 0 0 6px #FF3366;
    }

    .subtitle {
      text-align: center;
      color: #336699;
      margin-bottom: 1.5rem;
      font-size: 0.875rem;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    div:has(> #oauthPopupContainer) {
          display: flex;
          justify-content: center;
          align-items: center;
          flex-flow: row wrap;
          gap: 0.75rem;
          max-width: 100%;
        }

        #oauthPopupContainer,
        #browserAuthPanel:not([hidden]) {
          display: contents;
        }

        div:has(> #oauthPopupContainer) #authBtn,
        div:has(> #oauthPopupContainer) #disconnectAuthBtn {
          flex: 0 0 320px;
          width: 320px;
          height: 48px;
          padding: 0 1rem;
          border: 1px solid;
          border-radius: 4px;
          cursor: pointer;
          font-family: 'Share Tech Mono', monospace;
          font-size: 0.95rem;
          font-weight: normal;
          letter-spacing: normal;
          text-transform: none;
          white-space: nowrap;
          transition: all 0.2s;
        }

        div:has(> #oauthPopupContainer) #authBtn {
          background: #050f2e;
          color: #00AAFF;
          border-color: #00AAFF;
        }

        div:has(> #oauthPopupContainer) #authBtn:hover:not(:disabled) {
          background: #00AAFF;
          color: #020818;
          box-shadow: 0 0 20px rgba(0, 170, 255, 0.4);
        }

        div:has(> #oauthPopupContainer) #disconnectAuthBtn {
          background: #210b1a;
          color: #FF5577;
          border-color: #FF3366;
          box-shadow: 0 0 8px rgba(255, 51, 102, 0.2);
        }

        div:has(> #oauthPopupContainer) #disconnectAuthBtn:hover:not(:disabled) {
          background: #3b1025;
          color: #FF99AA;
          box-shadow: 0 0 16px rgba(255, 51, 102, 0.45);
        }

        div:has(> #oauthPopupContainer) > #authStatus {
          order: 2;
          flex-basis: 100%;
        }

        @media (max-width: 600px) {
      div:has(> #oauthPopupContainer) #authBtn,
      div:has(> #oauthPopupContainer) #disconnectAuthBtn {
        flex: 0 1 320px;
        width: min(320px, 100%);
      }

      .config-row {
        grid-template-columns: 1fr;
      }

      .summary {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <canvas id="matrix-canvas"></canvas>
  <div class="scanline-2"></div>
  <div class="scanline-3"></div>
  <div class="container">
    <h1>El Exportador</h1>
    <p class="subtitle">Importa tu biblioteca musical a YouTube Music</p>

    <div class="card">
      <div class="file-upload" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <div class="icon">[FILE]</div>
        <div id="uploadText">Drop .m3u file here</div>
        <div class="hint">or paste M3U content below</div>
        <input type="file" id="fileInput" accept=".m3u,.m3u8" onchange="handleFileFromInput(this)">
      </div>
      <div class="track-count" id="trackCount"></div>

      <div style="margin-top: 1rem;">
        <label>M3U Content</label>
        <textarea id="m3uContent" rows="7"></textarea>
      </div>

      <div class="config-row">
        <div>
          <label>Playlist Name</label>
          <input type="text" id="playlistName" placeholder="MY_PLAYLIST">
        </div>
        <div>
          <label for="threshold">Match Threshold
            <span class="help-icon">?
              <span class="tooltip">Minimum similarity percentage to consider a song as found. 60% works well for most cases.</span>
            </span>
          </label>
          <input type="number" id="threshold" value="0.6" min="0" max="1" step="0.05">
        </div>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="dryRun" checked>
        <label for="dryRun">Dry Run Mode (no playlist creation)</label>
      </div>

      <!-- Componente OAuthPopup -->
      <div style="margin: 1rem 0;">
        <div id="oauthPopupContainer">
          <button id="authBtn" type="button">[ CONNECT YOUTUBE MUSIC ]</button>
        </div>
        <div id="authStatus" style="
          margin-top: 0.5rem;
          color: #FF4444;
          font-family: 'Share Tech Mono', monospace;
          font-size: 0.875rem;
        ">
          ESTADO: NO AUTENTICADO
        </div>
        <div id="browserAuthPanel" hidden style="margin-top: 0.75rem; font-family: 'Share Tech Mono', monospace; font-size: 0.8rem; color: #00AAFF;">
                    <button class="btn" id="disconnectAuthBtn" type="button" hidden>[ DISCONNECT ]</button>
          <button class="btn" id="unusedBrowserAuthBtn" type="button" hidden aria-hidden="true"></button>
        </div>
      </div>

      <script>
        document.getElementById('authBtn').onclick = async () => {
          await startGuidedAuth();
        };
      </script>
      </div>

      <div style="margin-top: 1.5rem;">
        <button class="btn" id="startBtn" disabled>[ EXECUTE ]</button>
      </div>
    </div>

    <div class="card" style="margin-top: 1.5rem; max-width: 800px; margin-left: auto; margin-right: auto;">
      <h3>Progress Log</h3>
      <div class="progress-shell">
        <div class="progress-meta">
          <span class="progress-label" id="progressLabel">Idle</span>
          <span class="progress-percent" id="progressPercent">0%</span>
        </div>
        <div class="progress-track" aria-label="Conversion progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" role="progressbar">
          <div class="progress-bar" id="progressBar"></div>
          <div class="progress-scan"></div>
        </div>
      </div>

      <div class="backend-status" id="backendStatus">
        <span class="backend-dot unavailable"></span>
        <span>Checking backend...</span>
      </div>
    </div>

    <div class="card manual-review-section" id="manualReviewSection">
      <h3>Manual Review</h3>
      <p id="manualReviewDescription" style="color: #336699; font-size: 0.875rem; margin-bottom: 1rem;">
        Unmatched or ambiguous tracks detected. Search manually or choose a suggested match.
      </p>
      <div id="manualTracksList"></div>
      <button class="btn btn-add-manual" id="addManualBtn" disabled>[ ADD SELECTED ]</button>
    </div>

    <div class="card" id="summaryCard" style="display: none; max-width: 800px; margin-left: auto; margin-right: auto;">
      <h3>Summary</h3>
      <div class="summary" id="summaryGrid"></div>
      <div class="playlist-url" id="playlistUrl" style="display: none;"></div>
    </div>
  </div>

  <script>
    // File input handler
    window.handleFileFromInput = function(input) {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
       reader.onload = async function(e) {
         document.getElementById('m3uContent').value = e.target.result;
         const res = await fetch('/api/parse-m3u', {
           method: 'POST',
           headers: { 'Content-Type': 'application/json' },
           body: JSON.stringify({ content: e.target.result })
         });
         const data = await res.json();
         window.parsedTracks = data.tracks || [];
         document.getElementById('trackCount').textContent = '[' + window.parsedTracks.length + '] tracks loaded';
         // Set playlist name
         const playlistInput = document.getElementById('playlistName');
         playlistInput.value = file.name.replace(/\.(m3u|m3u8)$/i, '').replace(/[^\w\s-]/g, '_').toUpperCase();

         // Aplicar estilo verde al cuadro [FILE] inmediatamente
         dropZone.classList.add('has-file');
         uploadText.innerHTML = `<span class="filename">[OK] ${file.name}</span>`;
         dropZone.style.borderColor = '#00FF88';
         dropZone.style.color = '#00FF88';
         dropZone.style.backgroundColor = 'rgba(0, 255, 136, 0.1)';

          // Forzar actualización del DOM
          setTimeout(() => {
            dropZone.style.borderColor = '#00FF88';
            dropZone.style.color = '#00FF88';
          }, 100);

          // Habilitar el botón [EXECUTE] si el usuario está autenticado
          if (await checkAuthStatus()) {
            startBtn.disabled = false;
          }
       };
      reader.readAsText(file);
    };
  </script>

  <script>
    // Variables globales
    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const uploadText = document.getElementById('uploadText');
    const m3uContent = document.getElementById('m3uContent');
    const playlistName = document.getElementById('playlistName');
    const threshold = document.getElementById('threshold');
    const dryRun = document.getElementById('dryRun');
    const startBtn = document.getElementById('startBtn');

    const summaryCard = document.getElementById('summaryCard');
    const summaryGrid = document.getElementById('summaryGrid');
    const playlistUrl = document.getElementById('playlistUrl');
    const trackCount = document.getElementById('trackCount');
    const progressBar = document.getElementById('progressBar');
    const progressPercent = document.getElementById('progressPercent');
    const progressLabel = document.getElementById('progressLabel');
    const progressTrack = document.querySelector('.progress-track');
    const authStatus = document.getElementById('authStatus');
    const backendStatus = document.getElementById('backendStatus');
        const manualReviewSection = document.getElementById('manualReviewSection');
        const manualReviewDescription = document.getElementById('manualReviewDescription');
        const manualTracksList = document.getElementById('manualTracksList');
        const addManualBtn = document.getElementById('addManualBtn');
        const manualSelections = new Map();
    let parsedTracks = [];
    let lastPlaylistId = null;
    let lastConversionResults = [];
    let eventSource = null;
    const guidedBrowserAuthPanel = document.getElementById('browserAuthPanel');
        const disconnectAuthBtn = document.getElementById('disconnectAuthBtn');
    let authPoll = null;
    let authStatusPulseTimer = null;
    let authStatusShouldPulse = false;
    const unusedBrowserAuthHeaders = null;

    function stopAuthStatusPulse() {
      authStatusShouldPulse = false;
      if (authStatusPulseTimer !== null) {
        window.clearTimeout(authStatusPulseTimer);
        authStatusPulseTimer = null;
      }
      authStatus.classList.remove('auth-status-pulse');
    }

    function scheduleAuthStatusPulse() {
      if (!authStatusShouldPulse) return;
      authStatusPulseTimer = window.setTimeout(() => {
        authStatusPulseTimer = null;
        authStatus.classList.add('auth-status-pulse');
      }, 1000 + Math.random() * 4000);
    }

    authStatus.addEventListener('animationend', (event) => {
      if (event.animationName !== 'auth-status-pulse') return;
      authStatus.classList.remove('auth-status-pulse');
      scheduleAuthStatusPulse();
    });

    function setAuthStatus(message, color, shouldPulse = false) {
      stopAuthStatusPulse();
      authStatus.textContent = message;
      authStatus.style.color = color;
      authStatusShouldPulse = shouldPulse;
      if (shouldPulse) scheduleAuthStatusPulse();
    }

    async function saveBrowserAuth() {
      try {
        const response = await fetch('/api/ytmusic-auth/browser', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ headers: "" }),
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Invalid browser headers');

        guidedBrowserAuthPanel.hidden = true;
        await checkAuthStatus();
      } catch (error) {
        setAuthStatus('ESTADO: AUTENTICACIÓN REQUERIDA', '#FF4444');
        console.error('Browser authentication failed:', error);
      }
    }

    async function startGuidedAuth() {
      const response = await fetch('/api/ytmusic-auth/browser/start', { method: 'POST' });
      const result = await response.json();
      showGuidedAuthStatus(result.status);
      if (response.ok && !authPoll) pollGuidedAuth();
    }

    function showGuidedAuthStatus(status) {
      const active = ['launching', 'waiting_for_sign_in', 'validating'].includes(status);
          guidedBrowserAuthPanel.hidden = !(active || status === 'connected');
                    disconnectAuthBtn.hidden = status !== 'connected';
          if (status === 'connected') {
            setAuthStatus('ESTADO: AUTENTICADO', '#00FF88', true);
          } else if (active) {
            setAuthStatus('ESTADO: ESPERANDO AUTENTICACIÓN', '#00AAFF');
          } else if (status === 'cancelled') {
            setAuthStatus('ESTADO: AUTENTICACIÓN CANCELADA', '#FF4444');
          } else if (status === 'timed_out') {
            setAuthStatus('ESTADO: AUTENTICACIÓN AGOTADA', '#FF4444');
          } else if (status === 'error') {
            setAuthStatus('ESTADO: AUTENTICACIÓN FALLIDA', '#FF4444');
          } else {
            setAuthStatus('ESTADO: NO AUTENTICADO', '#FF4444', true);
          }
        }

        async function pollGuidedAuth() {
          const response = await fetch('/api/ytmusic-auth/browser/status');
          const result = await response.json();
          showGuidedAuthStatus(result.status);
          if (['launching', 'waiting_for_sign_in', 'validating'].includes(result.status)) {
            authPoll = window.setTimeout(pollGuidedAuth, 1000);
          } else {
            authPoll = null;
            if (result.status === 'connected') await checkAuthStatus();
          }
        }

                disconnectAuthBtn.onclick = async () => {
          await fetch('/api/ytmusic-auth/browser/disconnect', { method: 'POST' });
          showGuidedAuthStatus('idle');
          await checkAuthStatus();
        };

    async function startYtMusicAuthorization(popup) {
      setAuthStatus('ESTADO: ESPERANDO AUTENTICACIÓN', '#00AAFF');
      try {
        const response = await fetch('/api/ytmusic-auth/start', { method: 'POST' });
        const authorization = await response.json();
        if (!response.ok) throw new Error(authorization.error || 'Unable to start authorization');

        const authorizationUrl = new URL(authorization.verificationUrl);
        authorizationUrl.searchParams.set('user_code', authorization.userCode);
        navigator.clipboard?.writeText(authorization.userCode).catch(() => {});
        popup.location.href = authorizationUrl.toString();

        const poll = async () => {
          const pollResponse = await fetch('/api/ytmusic-auth/poll', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ authorizationId: authorization.authorizationId }),
          });
          const result = await pollResponse.json();
          if (result.status === 'authorized') {
            popup.close();
            await checkAuthStatus();
            return;
          }
          if (result.status === 'pending') {
            window.setTimeout(poll, Math.max(authorization.interval, 5) * 1000);
            return;
          }
          popup.close();
          setAuthStatus('ESTADO: AUTENTICACIÓN FALLIDA', '#FF4444');
        };
        window.setTimeout(poll, Math.max(authorization.interval, 5) * 1000);
      } catch (error) {
        popup.close();
        console.error('Unable to start YouTube Music authorization:', error);
        setAuthStatus('ESTADO: AUTENTICACIÓN FALLIDA', '#FF4444');
      }
    }

    // Función para verificar el estado de autenticación
    async function checkAuthStatus() {
      try {
        const response = await fetch('/api/auth-status');
        const data = await response.json();
        if (data.authenticated) {
          setAuthStatus('ESTADO: AUTENTICADO', '#00FF88', true);

           // Actualizar el estado global en zustand
           if (window.authStore) {
             window.authStore.getState().setCredentials("dummy-token", "youtube");
           }

           // Habilitar el botón [EXECUTE] si hay un archivo cargado
           if (dropZone.classList.contains('has-file')) {
             startBtn.disabled = false;
           }

           return true;
        } else {
          setAuthStatus('ESTADO: NO AUTENTICADO', '#FF4444', true);

          // Limpiar el estado global en zustand
          if (window.authStore) {
            window.authStore.getState().clearCredentials();
          }

          return false;
        }
      } catch (err) {
        console.error("Error al verificar estado de autenticación:", err);
        return false;
      }
    }

    // Función para guardar el estado en localStorage antes de redirigir a la autenticación
    const saveAuthState = () => {
      const fileName = dropZone.classList.contains('has-file') ? uploadText.textContent.replace('[OK] ', '') : '';
      const state = {
        timestamp: new Date().toISOString(),
        file: fileName,
        m3uContent: m3uContent.value,
        playlistName: playlistName.value
      };
      localStorage.setItem('m3uState', JSON.stringify(state));
      console.log('Estado guardado en localStorage:', state);
    };

    // Función para redirigir a la autenticación en la misma pestaña
    const redirectToAuth = () => {
      console.log('Botón de autenticación clickeado.');
      saveAuthState();
      window.location.href = `/auth`;
    };

    // Función para iniciar la conversión de la playlist
    function formatArtists(artist) {
          return Array.isArray(artist) ? artist.join(', ') : (artist || 'Unknown artist');
        }

        function updateManualAddButton() {
          addManualBtn.disabled = manualSelections.size === 0 || !lastPlaylistId;
          addManualBtn.title = lastPlaylistId
            ? ''
            : 'Manual additions require a playlist created by a non-dry-run conversion.';
        }

        function selectManualCandidate(trackId, candidate, candidateList) {
          manualSelections.set(trackId, candidate);
          candidateList.querySelectorAll('.manual-result').forEach((element) => {
            element.classList.toggle('selected', element.dataset.videoId === candidate.videoId);
          });
          updateManualAddButton();
        }

        function appendManualCandidate(trackId, candidate, candidateList) {
          if (!candidate || !candidate.videoId) return;
          const option = document.createElement('button');
          option.type = 'button';
          option.className = 'manual-result';
          option.dataset.videoId = candidate.videoId;

          const title = document.createElement('div');
          title.className = 'manual-result-title';
          title.textContent = candidate.title || 'Untitled track';
          const artist = document.createElement('div');
          artist.className = 'manual-result-artist';
          artist.textContent = formatArtists(candidate.artist);
          option.append(title, artist);
          option.addEventListener('click', () => selectManualCandidate(trackId, candidate, candidateList));
          candidateList.appendChild(option);
        }

        async function searchManualTrack(trackId, query, expectedArtist, expectedTitle, candidateList, searchButton) {
          if (!query) return;
          manualSelections.delete(trackId);
          updateManualAddButton();
          searchButton.disabled = true;
          try {
            const response = await fetch('/api/search-single', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ query, artist: expectedArtist, title: expectedTitle }),
            });
            const payload = await response.json();
            if (!response.ok) throw new Error(payload.error || 'Search failed');
            candidateList.replaceChildren();
            (payload.results || []).forEach((candidate) => {
              appendManualCandidate(trackId, candidate, candidateList);
            });
            if (!candidateList.childElementCount) {
              const noResults = document.createElement('div');
              noResults.className = 'manual-result-artist';
              noResults.textContent = 'No matches found. Try a different query.';
              candidateList.appendChild(noResults);
            }
          } catch (error) {
            console.error('Manual search failed:', error);
            const failed = document.createElement('div');
            failed.className = 'manual-result-artist';
            failed.textContent = 'Search failed. Please try again.';
            candidateList.replaceChildren(failed);
          } finally {
            searchButton.disabled = false;
          }
        }

        function showManualReview() {
          manualTracksList.replaceChildren();
          manualReviewSection.classList.add('visible');
          manualReviewDescription.textContent = lastPlaylistId
            ? 'Choose a suggestion or search YouTube Music for each unmatched or ambiguous track.'
            : 'Choose or search for matches now. Adding selections requires a playlist from a non-dry-run conversion.';

          lastConversionResults.forEach((track, index) => {
            const trackId = `review-${index}`;
            const card = document.createElement('div');
            card.className = 'manual-track';
            const header = document.createElement('div');
            header.className = 'manual-track-header';
            const info = document.createElement('div');
            info.className = 'manual-track-info';
            info.textContent = `${track.artist || 'Unknown artist'} — ${track.title || 'Untitled track'} (${track.status})`;
            header.appendChild(info);

            const actions = document.createElement('div');
            actions.className = 'manual-track-actions';
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'manual-search-input';
            input.value = [track.artist, track.title].filter(Boolean).join(' ');
            input.setAttribute('aria-label', `Search match for ${track.title || 'track'}`);
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'btn-small';
            button.textContent = '[ SEARCH ]';
            actions.append(input, button);
            header.appendChild(actions);
            card.appendChild(header);

            const candidates = document.createElement('div');
            candidates.className = 'manual-results';
            const seenVideoIds = new Set();
            [track.bestMatch, ...(track.alternatives || [])].forEach((candidate) => {
              if (candidate && candidate.videoId && !seenVideoIds.has(candidate.videoId)) {
                seenVideoIds.add(candidate.videoId);
                appendManualCandidate(trackId, candidate, candidates);
              }
            });
            if (!candidates.childElementCount) {
              const prompt = document.createElement('div');
              prompt.className = 'manual-result-artist';
              prompt.textContent = 'No suggested match. Search YouTube Music to choose one.';
              candidates.appendChild(prompt);
            }
            button.addEventListener('click', () => searchManualTrack(
              trackId, input.value.trim(), track.artist, track.title, candidates, button
            ));
            input.addEventListener('keydown', (event) => {
              if (event.key === 'Enter') searchManualTrack(
                trackId, input.value.trim(), track.artist, track.title, candidates, button
              );
            });
            card.append(candidates);
            manualTracksList.appendChild(card);
          });
          updateManualAddButton();
        }

        addManualBtn.addEventListener('click', async () => {
          if (!lastPlaylistId || !manualSelections.size) return;
          const tracks = [...new Map(
            [...manualSelections.values()].map((track) => [track.videoId, track])
          ).values()];
          addManualBtn.disabled = true;
          try {
            const response = await fetch('/api/add-to-playlist', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ playlistId: lastPlaylistId, tracks }),
            });
            const payload = await response.json();
            if (!response.ok) throw new Error(payload.error || 'Could not add selected tracks');
            manualSelections.clear();
            updateManualAddButton();
          } catch (error) {
            console.error('Adding manual selections failed:', error);
            updateManualAddButton();
          }
        });

        const startConversion = async () => {
      if (!window.parsedTracks || window.parsedTracks.length === 0) {
        alert("No hay tracks para convertir. Carga un archivo .m3u primero.");
        return;
      }

      const playlistNameValue = playlistName.value.trim();
      if (!playlistNameValue) {
        alert("Ingresa un nombre para la playlist.");
        return;
      }

      // Deshabilitar el botón durante la conversión
      startBtn.disabled = true;
      startBtn.textContent = "[ PROCESSING... ]";

      // Clear the previous conversion summary.
      summaryCard.style.display = "none";
          playlistUrl.style.display = "none";
          manualSelections.clear();
          manualTracksList.replaceChildren();
          manualReviewSection.classList.remove('visible');
          addManualBtn.disabled = true;

      // Configurar la barra de progreso
      progressBar.style.width = "0%";
      progressPercent.textContent = "0%";
      progressLabel.textContent = "Starting conversion...";

      try {
        // Crear EventSource para recibir actualizaciones de progreso
        eventSource = new EventSource(`/api/convert-progress?playlistName=${encodeURIComponent(playlistNameValue)}&dryRun=${dryRun.checked}&threshold=${threshold.value}`);

        eventSource.onmessage = (event) => {
          const data = JSON.parse(event.data);
          if (data.type === "progress") {
            const percent = Math.round((data.added / data.total) * 100);
            progressBar.style.width = `${percent}%`;
            progressPercent.textContent = `${percent}%`;
            progressLabel.textContent = data.artist && data.title
              ? `Searching ${data.artist} — ${data.title}`
              : `Processed ${data.added} of ${data.total} tracks`;
            backendStatus.lastElementChild.textContent = 'Backend is searching...';
            backendStatus.firstElementChild.className = 'backend-dot available';
          } else if (data.type === "result") {
            progressBar.style.width = "100%";
            progressPercent.textContent = "100%";
            progressLabel.textContent = "Completed";
            progressBar.parentElement.setAttribute("aria-valuenow", "100");
            backendStatus.lastElementChild.textContent = "Conversion completed";
            backendStatus.firstElementChild.className = "backend-dot available";
            eventSource.close();
            startBtn.disabled = false;
            startBtn.textContent = "[ EXECUTE ]";

            // Mostrar resumen solo al finalizar
            summaryCard.style.display = "block";
            summaryGrid.innerHTML = `
              <div class="summary-item summary-matched"><div class="summary-label">Matched:</div><div class="summary-value">${data.matched}</div></div>
              <div class="summary-item summary-unmatched"><div class="summary-label">Unmatched:</div><div class="summary-value">${data.unmatched}</div></div>
              <div class="summary-item summary-ambiguous"><div class="summary-label">Ambiguous:</div><div class="summary-value">${data.ambiguous}</div></div>
            `;

            if (data.playlistUrl) {
              playlistUrl.innerHTML = `Playlist URL: <a href="${data.playlistUrl}" target="_blank">${data.playlistUrl}</a>`;
              playlistUrl.style.display = "block";
            }

            // Guardar resultados para revisión manual
            lastPlaylistId = data.playlistId || null;
                lastConversionResults = data.manualReviewTracks || [
                  ...(data.unmatchedTracks || []),
                  ...(data.ambiguousTracks || []),
                ];
            if (lastConversionResults.length > 0) {
              showManualReview();
            }
          }
        };

        eventSource.onerror = (err) => {
          console.error("EventSource failed:", err);
          eventSource.close();

          // Rehabilitar el botón
          startBtn.disabled = false;
          startBtn.textContent = "[ EXECUTE ]";

          alert("Error durante la conversión. Revisa los logs.");
        };

        await new Promise((resolve, reject) => {
          const timeout = setTimeout(() => reject(new Error('Progress stream timed out')), 5000);
          eventSource.onopen = () => {
            clearTimeout(timeout);
            backendStatus.lastElementChild.textContent = 'Backend connected';
            backendStatus.firstElementChild.className = 'backend-dot available';
            resolve();
          };
        });

        // Send tracks only after the progress stream is connected.
        const response = await fetch('/api/convert', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            tracks: window.parsedTracks,
            playlistName: playlistNameValue,
            dryRun: dryRun.checked,
            threshold: parseInt(threshold.value)
          })
        });

        if (!response.ok) {
          throw new Error(`Server error: ${response.statusText}`);
        }

      } catch (err) {
        console.error("Error durante la conversión:", err);
        alert("Error durante la conversión. Revisa los logs.");

        // Rehabilitar el botón
        startBtn.disabled = false;
        startBtn.textContent = "[ EXECUTE ]";
      }
    };

    // Asignar el evento onclick al botón [EXECUTE]
    startBtn.onclick = startConversion;

    // Restaurar estado desde localStorage al cargar la página
    const restoreState = () => {
      console.log('Iniciando restauración de estado...');
      const savedState = localStorage.getItem('m3uState');
      if (!savedState) {
        console.log('No hay estado guardado en localStorage.');
        return;
      }
      console.log('Estado guardado en localStorage:', savedState);
      const state = JSON.parse(savedState);
      const now = new Date();
      const stateTime = new Date(state.timestamp);
      const oneHour = 60 * 60 * 1000;
      if (now - stateTime > oneHour) {
        console.log('Estado caducado. Limpiando localStorage.');
        localStorage.removeItem('m3uState');
        return;
      }
      if (state.file) {
        console.log('Restaurando [File]:', state.file);
        dropZone.classList.add('has-file');
        uploadText.innerHTML = `[OK] ${state.file}`;
        dropZone.style.borderColor = '#00FF88';
        dropZone.style.color = '#00FF88';
        dropZone.style.backgroundColor = 'rgba(0, 255, 136, 0.1)';
      }
      if (state.m3uContent) {
        console.log('Restaurando m3uContent.');
        m3uContent.value = state.m3uContent;
      }
      if (state.playlistName) {
        console.log('Restaurando playlistName:', state.playlistName);
        playlistName.value = state.playlistName;
      }
    };

    // Escuchar mensajes del popup de autenticación
    window.addEventListener('message', async (event) => {
      console.info('[auth] Window message received');

      // Verificar el origen del mensaje para evitar problemas de seguridad
      if (event.origin !== 'http://localhost:3000') {
        console.warn('[auth] Window message rejected: invalid origin');
        return;
      }

      if (event.data.type === 'auth_success') {
        console.info('[auth] Authentication success message received');
        const token = event.data.token;

        // Validar el token en el backend
        try {
          console.info('[auth] Token validation requested');
          const response = await fetch('/auth/validate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token })
          });
          const data = await response.json();


           if (data.valid) {
             console.info('[auth] Token validation accepted');
             // Actualizar el estado de autenticación
             if (window.authStore) {
               window.authStore.getState().setCredentials(token, "youtube");
             }
             const isAuthenticated = await checkAuthStatus();

             // Habilitar el botón [EXECUTE] si hay un archivo cargado
             if (isAuthenticated && dropZone.classList.contains('has-file')) {
               startBtn.disabled = false;
             }
           } else {
             console.error('[auth] Token validation rejected');
           }
        } catch (err) {
          console.error('[auth] Token validation failed');
        }
      } else if (event.data === 'auth_error') {
        console.error('[auth] Authentication error message received');
        alert('Error al iniciar la autenticación. Verifica la configuración.');
      } else {
        console.warn('[auth] Unknown window message received');
      }
    });

    // Llamar a checkAuthStatus al cargar la página
    document.addEventListener('DOMContentLoaded', () => {
      checkAuthStatus();

      // Verificar si hay un parámetro de autenticación
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.has('auth')) {
        const authStatus = urlParams.get('auth');
        if (authStatus === 'success') {
          console.log('Autenticación exitosa detectada');
          checkAuthStatus(); // Verificar el estado nuevamente
        } else if (authStatus === 'error') {
          alert('Error en la autenticación. Inténtalo nuevamente.');
        }
        // Limpiar el parámetro de la URL
        window.history.replaceState({}, document.title, '/');
      }
    });

    // Verificar si la autenticación fue cancelada
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('cancelled')) {
      localStorage.removeItem('m3uState');
      window.location.search = '';
    }
  </script>

  <script>
    // Matrix animation
    (function() {
      const canvas = document.getElementById('matrix-canvas');
      const ctx = canvas.getContext('2d');
      const CHARS = '0アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン1';
      const FONT_SIZE = 14;
      const CHAR_COLOR = '#003366';
      const HEAD_COLOR = '#0066AA';
      let columns = [];
      let width, height;

      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        const colCount = Math.floor(width / FONT_SIZE);
        columns = [];
        for (let i = 0; i < colCount; i++) {
          columns.push({
            x: i * FONT_SIZE,
            y: Math.random() * height,
            speed: 1 + Math.random() * 2,
            chars: []
          });
        }
      }

      function getRandomChar() {
        return CHARS[Math.floor(Math.random() * CHARS.length)];
      }

      function draw() {
        ctx.fillStyle = 'rgba(2, 8, 24, 0.05)';
        ctx.fillRect(0, 0, width, height);
        ctx.font = `${FONT_SIZE}px 'Share Tech Mono', monospace`;
        columns.forEach(col => {
          for (let i = 0; i < col.chars.length; i++) {
            const charY = col.y - i * FONT_SIZE;
            if (charY < 0 || charY > height) continue;
            if (i === 0) {
              ctx.fillStyle = HEAD_COLOR;
            } else {
              const alpha = 0.3 + (1 - i / col.chars.length) * 0.5;
              ctx.fillStyle = CHAR_COLOR;
              ctx.globalAlpha = alpha;
            }
            ctx.fillText(col.chars[i], col.x, charY);
          }
          ctx.globalAlpha = 1;
          col.y += col.speed;
          if (Math.random() < 0.08) {
            if (col.chars.length === 0 || col.chars[0] !== getRandomChar()) {
              col.chars.unshift(getRandomChar());
            }
          }
          if (Math.random() < 0.04) {
            col.chars.pop();
          }
          if (col.y - col.chars.length * FONT_SIZE > height + FONT_SIZE * 10) {
            col.y = -FONT_SIZE * (5 + Math.floor(Math.random() * 20));
            col.chars = [];
          }
        });
        requestAnimationFrame(draw);
      }

      resize();
      window.addEventListener('resize', resize);
      draw();
    })();
  </script>
